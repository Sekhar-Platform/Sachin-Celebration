<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sachin Tendulkar - Century Celebration</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        .celebration {

            width: 100vw;
            height: 100vh;

            position: relative;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.60)
                ),
                url('/sachin.png');

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            text-align: center;

            color: white;
        }

        .content {

            position: relative;

            z-index: 2;

            margin-top: 8vh;

            padding: 20px;
        }

        .century {

            font-size: clamp(45px, 7vw, 110px);

            font-weight: 900;

            letter-spacing: 4px;

            text-shadow:
                0 4px 15px rgba(0, 0, 0, 0.8);

            animation: celebration 1.5s ease-in-out infinite alternate;
        }

        .line {

            width: 35%;

            min-width: 200px;

            height: 3px;

            background: white;

            margin: 25px auto;
        }

        .subtitle {

            font-size: clamp(22px, 3vw, 42px);

            font-weight: 400;

            margin-bottom: 15px;
        }

        .name {

            font-size: clamp(25px, 4vw, 55px);

            font-weight: 800;

            letter-spacing: 5px;

            color: #ffc107;

            text-shadow:
                0 3px 10px rgba(0, 0, 0, 0.8);
        }

        .badge {

            margin-top: 30px;

            display: inline-block;

            padding: 12px 25px;

            border: 2px solid rgba(255,255,255,0.8);

            border-radius: 30px;

            font-size: 18px;

            background: rgba(0,0,0,0.35);

            backdrop-filter: blur(5px);
        }

        .confetti {

            position: absolute;

            width: 8px;
            height: 14px;

            top: -20px;

            animation: fall linear infinite;

            opacity: 0.9;
        }

        @keyframes celebration {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.05);
            }
        }

        @keyframes fall {

            from {
                transform:
                    translateY(-20px)
                    rotate(0deg);
            }

            to {
                transform:
                    translateY(110vh)
                    rotate(720deg);
            }
        }

        .footer {

            position: absolute;

            bottom: 25px;

            left: 0;

            right: 0;

            font-size: 15px;

            opacity: 0.8;

            z-index: 3;
        }

    </style>

</head>

<body>

<div class="celebration">

    <div class="content">

        <div class="century">
            100th CENTURY!
        </div>

        <div class="line"></div>

        <div class="subtitle">
            The God of Cricket
        </div>

        <div class="name">
            SACHIN TENDULKAR
        </div>

        <div class="badge">
            🏏 A Legend. A Billion Dreams. 🇮🇳
        </div>

    </div>

    <div class="footer">
        Powered by Spring Boot • Deployed through CI/CD
    </div>

</div>

<script>

    const colors = [
        "#ff9933",
        "#ffffff",
        "#138808",
        "#ffd700"
    ];

    for (let i = 0; i < 100; i++) {

        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left =
            Math.random() * 100 + "vw";

        confetti.style.animationDuration =
            (Math.random() * 3 + 3) + "s";

        confetti.style.animationDelay =
            Math.random() * 5 + "s";

        confetti.style.background =
            colors[
                Math.floor(
                    Math.random() * colors.length
                )
            ];

        document
            .querySelector(".celebration")
            .appendChild(confetti);
    }

</script>

</body>

</html>
