
name: Build and Push to ECR

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: hello-springboot

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # 1. Checkout source code
      # -----------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # -----------------------------------------
      # 2. Setup Java
      # -----------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # -----------------------------------------
      # 3. Build Spring Boot application
      # -----------------------------------------
      - name: Build Spring Boot application
        run: |
          mvn clean package -DskipTests


      # -----------------------------------------
      # TEMPORARY: Debug GitHub OIDC claims
      # -----------------------------------------
      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          echo "Reading GitHub OIDC claims..."

          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: Could not obtain OIDC token"
            exit 1
          fi

          # Print claims only - NEVER print the complete token
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null || true)

          echo "$PAYLOAD" | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_id,
            repository_owner,
            repository_owner_id,
            ref
          }'


      # -----------------------------------------
      # 4. Configure AWS credentials using OIDC
      # -----------------------------------------
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::632404567481:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}


      # -----------------------------------------
      # 5. Verify AWS identity
      # -----------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # -----------------------------------------
      # 6. Login to Amazon ECR
      # -----------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # -----------------------------------------
      # 7. Build Docker image
      # -----------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            .


      # -----------------------------------------
      # 8. Tag Docker image
      # -----------------------------------------
      - name: Tag Docker image
        run: |
          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}


      # -----------------------------------------
      # 9. Push Docker image to ECR
      # -----------------------------------------
      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}


      # -----------------------------------------
      # 10. Display image
      # -----------------------------------------
      - name: Display ECR image
        run: |
          echo "Image pushed successfully:"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
